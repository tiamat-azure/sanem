<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sanem</title>
    <link rel="stylesheet" href="https://releases.transloadit.com/uppy/v5.2.4/uppy.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-max-file-gb="%%MAX_FILE_GB%%">
    <!-- Login (shown when /api/session -> authenticated: false) -->
    <div id="login-screen" class="screen" hidden>
      <form id="login-form" class="login-card">
        <h1>Sanem</h1>
        <p class="tagline">Putum &amp; Lukluk - dépose et regarde.</p>
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Entrer</button>
        <p id="login-error" class="error-message" role="alert" hidden></p>
      </form>
    </div>

    <!-- Application shell -->
    <div id="app" class="screen" hidden>
      <header class="app-header">
        <a class="brand" href="#/">Sanem</a>
        <div class="header-actions">
          <button
            id="app-menu-button"
            type="button"
            aria-label="Menu"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="app-menu"
            title="Menu"
          >
            ☰
          </button>
          <nav id="app-menu" class="app-menu" hidden aria-label="Menu de l'application">
            <a class="app-menu-item" data-tab="putum" href="#/putum">Putum</a>
            <a class="app-menu-item" data-tab="lukluk" href="#/lukluk">Lukluk</a>
            <button id="theme-toggle" type="button">Thème clair</button>
            <button id="logout-button" type="button">Déconnexion</button>
          </nav>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>
    </div>

    <!-- Screen templates -->
    <template id="tpl-hub">
      <section class="hub">
        <h1 class="hub-title">Que veux-tu faire&nbsp;?</h1>
        <div class="hub-tiles">
          <a class="hub-tile tile-putum" href="#/putum">
            <span class="tile-icon" aria-hidden="true">📤</span>
            <span class="tile-term">Putum</span>
            <span class="tile-gloss">Envoyer des fichiers</span>
          </a>
          <a class="hub-tile tile-lukluk" href="#/lukluk">
            <span class="tile-icon" aria-hidden="true">🎬</span>
            <span class="tile-term">Lukluk</span>
            <span class="tile-gloss" data-hub-count>Regarder les vidéos</span>
          </a>
        </div>
      </section>
    </template>

    <template id="tpl-putum">
      <section class="putum">
        <h1>Putum - déposer</h1>
        <label class="field">
          <span>Ranger dans</span>
          <select id="series-select"></select>
        </label>
        <div id="new-series-field" class="field" hidden>
          <label for="new-series-name">Nom de la nouvelle série</label>
          <input id="new-series-name" type="text" placeholder="Ex. Anime - Frieren" />
        </div>
        <section id="dashboard-container" aria-label="Zone de dépôt"></section>
      </section>
    </template>

    <template id="tpl-lukluk">
      <section class="lukluk">
        <div id="featured" class="featured" hidden></div>
        <div id="rows"></div>
        <p id="lukluk-empty" class="empty-message" hidden>
          Aucune vidéo pour le moment. Passe par Putum pour en déposer.
        </p>
      </section>
    </template>

    <template id="tpl-serie">
      <section class="serie">
        <a class="back-link" href="#/lukluk">← Vidéothèque</a>
        <h1 id="serie-title"></h1>
        <p id="serie-count" class="serie-count"></p>
        <div id="serie-hero" class="serie-hero" hidden></div>
        <div id="serie-rail" class="rail" hidden>
          <button type="button" class="rail-arrow prev" aria-label="Épisodes précédents">‹</button>
          <div id="serie-track" class="rail-track"></div>
          <button type="button" class="rail-arrow next" aria-label="Épisodes suivants">›</button>
        </div>
        <p id="serie-empty" class="empty-message" hidden>Série introuvable.</p>
      </section>
    </template>

    <template id="tpl-player">
      <section class="player-screen">
        <a class="back-link" id="player-back" href="#/lukluk">← Retour</a>
        <div id="player-warning" class="player-warning" hidden></div>
        <div id="player-root" class="player-root"></div>
      </section>
    </template>

    <script src="https://releases.transloadit.com/uppy/v5.2.4/uppy.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
    <script type="module" src="/player.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
